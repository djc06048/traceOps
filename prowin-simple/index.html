<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProWin · 제안 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/style.css">
</head><body>

<!-- 로그인 -->
<div id="login" class="login">
  <div class="login-box">
    <div class="login-brand">ProWin</div>
    <p class="login-sub" id="loginProj"></p>
    <label class="fld"><span>아이디</span><input id="loginId" autocomplete="username"></label>
    <label class="fld"><span>비밀번호</span><input id="loginPw" type="password" autocomplete="current-password"></label>
    <button class="btn login-btn" id="btnLogin">로그인</button>
    <div class="login-quick">
      <span>로그인 정보 채우기</span>
      <div class="pick-btns">
        <button class="btn ghost sm" data-quick="writer">작성자</button>
        <button class="btn ghost sm" data-quick="pm">PM</button>
        <button class="btn ghost sm" data-quick="sales">영업대표</button>
        <button class="btn ghost sm" data-quick="admin">시스템관리자</button>
      </div>
    </div>
    <p class="muted" style="margin-top:14px">데모용 로그인입니다. 비밀번호는 데이터 파일에 평문으로 들어 있어 실제 운영에는 쓸 수 없습니다.</p>
  </div>
</div>

<!-- 앱 -->
<div id="app" style="display:none">
  <div class="gnb">
    <div class="wm">ProWin</div>
    <div class="proj" id="projName"></div>
    <div class="sp"></div>
    <div class="toolbar">
      <span class="dstate" id="dataState"></span>
      <button class="btn ghost sm" id="btnRestore">원본 복원</button>
      <button class="btn ghost sm" id="btnExport">내보내기</button>
      <button class="btn sm" id="btnSave">저장</button>
    </div>
    <div class="me">
      <span id="meTag"></span>
      <button class="btn ghost sm" id="btnLogout">로그아웃</button>
    </div>
  </div>
  <div class="shell">
    <nav class="side" id="side"></nav>
    <main class="main">
      <div class="crumb" id="crumb"></div>
      <div class="page-hd">
        <div><h1 id="title"></h1><p id="desc"></p></div>
        <button class="btn ghost sm" id="btnInfo">ⓘ 화면 정보</button>
      </div>
      <div id="content"></div>
    </main>
  </div>
</div>

<div class="modal-bg" id="modal"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<script src="js/app.js"></script>
</body></html>
