<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProWin · 제안 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/style.css">
</head><body>

<div class="gnb">
  <div class="wm">ProWin</div>
  <div class="proj" id="projName"></div>
  <div class="sp"></div>
  <div class="role-switch">
    <span class="lbl" id="roleTag"></span>
    <div class="seg">
      <button id="btnWriter" class="active" data-role="writer">작성자</button>
      <button id="btnPM" data-role="pm">PM</button>
      <button id="btnSales" data-role="sales">영업대표</button>
    </div>
  </div>
</div>

<div class="shell">
  <nav class="side" id="side"></nav>
  <main class="main">
    <div class="crumb" id="crumb"></div>
    <div class="page-hd">
      <div><h1 id="title"></h1><p id="desc"></p></div>
      <button class="btn ghost sm" id="btnInfo">ⓘ 화면 정보</button>
    </div>
    <div class="data-bar">
      <span id="dataState"></span>
      <span class="pick-btns">
        <button class="btn ghost sm" id="btnRestore">원본 복원</button>
        <button class="btn ghost sm" id="btnExport">내보내기</button>
        <button class="btn sm" id="btnSave">저장</button>
      </span>
    </div>
    <div id="content"></div>
  </main>
</div>

<div class="modal-bg" id="modal"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<script src="js/app.js"></script>
</body></html>
