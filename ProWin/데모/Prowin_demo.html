<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProWin · 통합 데모</title>
<style>
  :root{
    --hw:#F37321; --hw70:#F89B6C; --hw50:#FBB584; --wash:#FDF1E9; --hwline:#F5D5C0;
    --ink:#1A1A18; --ink2:#4A4844; --ink3:#8B8981;
    --bg:#F1F0EC; --card:#FFF; --line:#E7E5E0; --line2:#DAD8D2;
    --ok:#2F9E6B; --okbg:#E7F4EC; --okink:#1E7049;
    --dg:#DB5B47; --dgbg:#FBEAE6; --dgink:#AE3B2B;
    --bl:#3D6FB0; --blbg:#EAF0F8; --pp:#7A5AF0; --ppbg:#F0ECFB;
    --gbg:#F1F0ED; --gink:#7C7A73;
    --r:12px; --mono:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit}
  .mono{font-family:var(--mono)}
  .mark{flex:none}.mark svg{display:block}

  #login{position:fixed;inset:0;background:linear-gradient(135deg,#1A1A18,#2C2A26);display:flex;align-items:center;justify-content:center;z-index:50;transition:opacity .5s}
  #login.hide{opacity:0;pointer-events:none}
  .lcard{width:360px;background:#fff;border-radius:16px;padding:38px 34px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
  .lcard .b{display:flex;align-items:center;gap:11px;margin-bottom:26px}
  .lcard h1{font-size:15px;font-weight:700}.lcard .sub{font-size:12px;color:var(--ink3)}
  .fld{margin-bottom:14px}.fld label{display:block;font-size:12px;color:var(--ink2);margin-bottom:6px;font-weight:600}
  .fld input{width:100%;padding:11px 13px;border:1px solid var(--line2);border-radius:9px;font-size:14px;background:#FBFAF8}
  .fld input:focus{outline:none;border-color:var(--hw);background:#fff}
  .bprimary{width:100%;padding:12px;background:var(--hw);color:#fff;border-radius:9px;font-weight:700}
  .bprimary:hover{background:#DE6417}.lnote{margin-top:16px;font-size:11px;color:var(--ink3);text-align:center}

  #shell{display:none;flex-direction:column;height:100vh}#shell.show{display:flex}
  .rolebar{background:var(--ink);color:#fff;padding:8px 20px;display:flex;align-items:center;gap:10px;font-size:12px;flex:none}
  .rolebar .lb{color:#B9B7B0}
  .rolebar .rb{display:flex;gap:6px}
  .rolebar button{padding:5px 12px;border-radius:20px;background:#33312C;color:#D8D6D0;font-size:11.5px;font-weight:600}
  .rolebar button.on{background:var(--hw);color:#fff}
  .rolebar .tag{margin-left:auto;font-size:11px;color:#B9B7B0}

  #app{display:flex;flex:1;overflow:hidden}
  .sb{width:250px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;overflow-y:auto}
  .sbb{display:flex;align-items:center;gap:10px;padding:6px 8px 12px}
  .sbb .nm{font-size:15px;font-weight:700}.sbb .ctx{font-size:11px;color:var(--ink3)}
  .sbcr{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--hw);color:#fff;padding:10px;border-radius:9px;font-weight:700;font-size:13px;margin-bottom:10px}
  .sbcr:hover{background:#DE6417}
  .sbsec{font-size:10px;font-weight:700;letter-spacing:.4px;color:var(--ink3);text-transform:uppercase;padding:12px 10px 5px}
  .nav{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 10px;border-radius:8px;font-size:13px;color:var(--ink2);font-weight:500}
  .nav .ic{width:16px;text-align:center;opacity:.7;flex:none}
  .nav:hover{background:#F6F5F2}
  .nav.on{background:var(--wash);color:var(--hw);font-weight:700}.nav.on .ic{opacity:1}
  .nav .p2{margin-left:auto;font-size:9px;font-weight:700;padding:1px 6px;border-radius:20px;background:var(--ppbg);color:var(--pp)}
  .sbsp{flex:1}
  .sbu{display:flex;align-items:center;gap:9px;padding:8px;border-radius:9px;margin-top:6px}.sbu:hover{background:#F6F5F2}
  .av{width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;background:var(--hw)}
  .av.g{background:#8B8981}.av.k{background:var(--bl)}.av.l{background:var(--pp)}.av.h{background:#D98C3A}.av.p{background:#6C63A8}
  .sbu .n{font-size:12.5px;font-weight:600;line-height:1.3}.sbu .e{font-size:10px;color:var(--ink3)}

  .main{flex:1;overflow-y:auto;background:var(--bg)}
  .top{position:sticky;top:0;background:rgba(241,240,236,.92);backdrop-filter:blur(6px);z-index:5;padding:15px 26px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .crumb{font-size:12px;color:var(--ink3)}.crumb b{color:var(--ink2)}
  .top h2{font-size:18px;font-weight:700}
  .top .p2b{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--ppbg);color:var(--pp);align-self:center}
  .top .p1b{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--okbg);color:var(--okink);align-self:center}
  .projsw{font-size:12px;padding:6px 10px;border-radius:8px;border:1px solid var(--line2);background:#fff;color:var(--ink2)}
  .acts{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:5px;padding:8px 12px;border-radius:8px;font-size:12.5px;font-weight:600;border:1px solid var(--line2);background:#fff;color:var(--ink2)}
  .btn:hover{border-color:var(--ink3)}.btn.acc{background:var(--hw);color:#fff;border-color:var(--hw)}.btn.acc:hover{background:#DE6417}
  .btn.soon,.btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn.dirty{background:var(--ink);color:#fff;border-color:var(--ink)}
  .cont{padding:20px 26px 70px}
  .scr{display:none;animation:fade .25s}.scr.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r)}
  .sect{font-size:13px;font-weight:700;color:var(--ink2);margin:24px 4px 11px}
  .chip{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px}
  .chip.doing{background:var(--wash);color:#C25A16}.chip.done{background:var(--okbg);color:var(--okink)}
  .chip.todo{background:var(--gbg);color:var(--gink)}.chip.fix{background:var(--dgbg);color:var(--dgink)}
  .idot{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--line);color:var(--ink3);font-size:10px;font-weight:700;cursor:pointer;font-style:italic}
  .idot:hover{background:var(--hw);color:#fff}
  .deny{padding:40px;text-align:center;color:var(--ink3)}
  .deny .ic{font-size:30px;margin-bottom:10px}
  .deny h3{color:var(--ink2);font-size:15px;margin-bottom:6px}

  table.tbl{width:100%;border-collapse:collapse;font-size:13px}
  table.tbl th{text-align:left;font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.3px;padding:11px 14px;border-bottom:1px solid var(--line);background:#FBFAF8}
  table.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  table.tbl tr:last-child td{border-bottom:none}
  .prow{cursor:pointer}.prow:hover{background:#FBFAF8}
  .pbar{width:90px;height:6px;background:#EDEBE6;border-radius:6px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px}
  .pbar span{display:block;height:100%;background:linear-gradient(90deg,var(--hw),var(--hw70))}
  .st{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
  .st.doing{background:var(--wash);color:#C25A16}.st.done{background:var(--okbg);color:var(--okink)}.st.prep{background:var(--gbg);color:var(--gink)}

  .hgrid{display:grid;grid-template-columns:1fr 320px;gap:16px}
  .kv{display:flex;gap:8px;font-size:13px;padding:6px 0}.kv .k{color:var(--ink3);width:70px;flex:none}
  .todo-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
  .todo-item:last-child{border:none}.todo-item .dt{margin-left:auto;font-size:11px;color:var(--ink3)}
  .lt{width:8px;height:8px;border-radius:2px;flex:none}
  .delay .todo-item{color:var(--dgink)}.delay .lt{background:var(--dg)}

  .cal{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
  .cal .head{display:grid;grid-template-columns:repeat(7,1fr);background:#FBFAF8;border-bottom:1px solid var(--line)}
  .cal .head div{padding:8px;font-size:11px;font-weight:700;color:var(--ink3);text-align:center}
  .cal .head div:first-child{color:var(--dg)}.cal .head div:last-child{color:var(--bl)}
  .week{position:relative;border-bottom:1px solid var(--line)}.week:last-child{border:none}
  .days{display:grid;grid-template-columns:repeat(7,1fr);min-height:104px}
  .day{border-right:1px solid var(--line);padding:5px 6px;position:relative}.day:last-child{border:none}
  .day .n{font-size:11px;color:var(--ink2);font-weight:600}.day.out .n{color:#C9C7C0}
  .day.today .n{background:var(--dg);color:#fff;border-radius:50%;width:19px;height:19px;display:inline-flex;align-items:center;justify-content:center}
  .bars{position:absolute;left:0;right:0;top:22px;pointer-events:none}
  .bar{position:absolute;height:18px;border-radius:4px;font-size:10px;font-weight:600;color:#fff;padding:1px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:16px;pointer-events:auto;cursor:pointer}
  .c-wr{background:#5FA97E}.c-rv{background:#5B87C0}.c-mt{background:var(--hw70)}.c-dl{background:#D9604E}.c-gy{background:#A7A59E}

  .file{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:10px}
  .file .ic{width:36px;height:36px;border-radius:8px;background:var(--dgbg);color:var(--dgink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px}
  .req{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .req:hover{background:#FBFAF8}.req.sel{background:var(--wash)}
  .req:last-child{border:none}.req .c{font-family:var(--mono);font-size:11px;color:var(--hw);font-weight:700;width:42px;flex:none}
  .req .t{font-weight:600}.req .d{font-size:12px;color:var(--ink3)}

  .acard2{padding:12px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px}
  .acard2 .ti{font-weight:600;font-size:12.5px}.acard2 .mt{font-size:11px;color:var(--ink3);margin-top:3px}
  .acard2 .pg{font-family:var(--mono);font-size:10px;color:var(--hw);margin-top:5px}

  table.toc{width:100%;border-collapse:collapse;font-size:12px}
  table.toc th{background:#FBFAF8;font-size:10.5px;font-weight:700;color:var(--ink3);padding:8px 10px;text-align:left;border:1px solid var(--line);position:sticky;top:0}
  table.toc td{padding:7px 10px;border:1px solid var(--line)}
  table.toc .l1{font-weight:700;background:#FCF6F0}
  .who{font-size:10px;color:#fff;border-radius:5px;padding:1px 6px;font-weight:700}
  .who.g{background:#8B8981}.who.k{background:var(--bl)}.who.l{background:var(--pp)}.who.o{background:var(--hw)}.who.h{background:#D98C3A}

  .edt{display:grid;grid-template-columns:290px 1fr;gap:16px}
  .tnode{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:12.5px}
  .tnode:hover{background:#F6F5F2}.tnode.sel{background:var(--wash)}
  .tnode.grp{font-weight:700;margin-top:3px}.tnode.ch{padding-left:20px;color:var(--ink2)}.tnode.ch2{padding-left:34px;font-size:12px;color:var(--ink3)}
  .dt2{width:8px;height:8px;border-radius:50%;flex:none}
  .dt2.todo{background:#C9C7C0}.dt2.doing{background:var(--hw)}.dt2.done{background:var(--ok)}.dt2.fix{background:var(--dg)}
  .tnode .w{margin-left:auto;font-size:9px;color:#fff;background:var(--ink3);border-radius:5px;padding:1px 5px;font-weight:700}
  .slide{aspect-ratio:16/9;margin:14px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px 20px;box-shadow:0 2px 8px rgba(0,0,0,.04);display:flex;flex-direction:column}
  .slide .stt{font-size:14px;font-weight:700;border-bottom:2px solid var(--hw);display:inline-block;padding-bottom:4px;margin-bottom:8px}
  .slide ul{list-style:none;font-size:11.5px;color:var(--ink2)}
  .slide li{padding:2px 0 2px 14px;position:relative}
  .slide li:before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--hw70)}
  .slide .pg{margin-top:auto;text-align:right;font-size:10px;color:var(--ink3)}
  .flow{display:flex;align-items:center;gap:6px;margin:6px 0 10px}
  .fbox{flex:1;background:var(--wash);border:1px solid var(--hwline);border-radius:6px;padding:6px 4px;text-align:center;font-size:10px;font-weight:600;color:#8a4a1c}
  .farr{color:var(--hw);font-size:13px;flex:none}
  .pvtop{display:flex;align-items:center;gap:8px;padding:9px 13px;border-bottom:1px solid var(--line);background:#fff;border-radius:10px 10px 0 0}
  .pvtop .lb{font-size:11px;color:var(--ink3);font-weight:600}
  .pvtop .wn{margin-left:auto;font-size:10px;font-weight:700;color:#C25A16;background:var(--wash);padding:3px 8px;border-radius:20px}
  .tgl{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);cursor:pointer;user-select:none}
  .tk{width:34px;height:19px;border-radius:20px;background:var(--line2);position:relative;transition:.2s;flex:none}
  .tk:after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.2s}
  .tgl.on .tk{background:var(--hw)}.tgl.on .tk:after{transform:translateX(15px)}
  .cmt{display:flex;gap:10px;margin-bottom:12px}.cmt .av{width:26px;height:26px;font-size:10px}
  .cmt .nm{font-size:12px;font-weight:700}.cmt .nm span{font-weight:500;color:var(--ink3);font-size:10px;margin-left:6px;font-family:var(--mono)}
  .cmt .tx{font-size:12.5px;color:var(--ink2)}
  .cadd{display:flex;gap:8px;margin-top:6px}
  .cadd input{flex:1;padding:9px 12px;border:1px solid var(--line2);border-radius:8px;font-size:12.5px}
  .cadd input:focus{outline:none;border-color:var(--hw)}.cadd button{padding:0 15px;background:var(--ink);color:#fff;border-radius:8px;font-size:12.5px;font-weight:600}

  table.mx{border-collapse:collapse;width:100%;font-size:12px}
  table.mx th,table.mx td{border:1px solid var(--line);padding:7px 8px}
  table.mx th{background:#FBFAF8;font-weight:700;color:var(--ink2);font-size:10.5px}
  table.mx td.y{text-align:center;font-weight:700;color:var(--ok)}
  table.mx td.n{text-align:center;color:var(--ink3)}

  .git{display:grid;grid-template-columns:1fr 330px;gap:16px}
  .brs{display:flex;gap:8px;padding:8px 12px 14px}
  .br{font-size:12px;font-weight:700;padding:5px 11px;border-radius:20px;border:1px solid var(--line2);background:#fff}
  .br.cur{border-color:var(--hw);color:var(--hw);background:var(--wash)}
  .cm{display:flex;gap:14px;padding:0 10px;cursor:pointer}
  .rail{width:16px;flex:none;position:relative;display:flex;justify-content:center}
  .rail:before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line2)}
  .cm:first-child .rail:before{top:20px}.cm:last-child .rail:before{bottom:auto;height:20px}
  .knob{width:13px;height:13px;border-radius:50%;background:#fff;border:2.5px solid var(--hw);margin-top:15px;z-index:1}
  .cm.tag .knob{border-color:var(--pp)}.cm.sel .knob{background:var(--hw);box-shadow:0 0 0 4px var(--wash)}
  .cb{flex:1;padding:12px 0 14px;border-bottom:1px solid var(--line)}.cm:last-child .cb{border:none}
  .cb .msg{font-size:13.5px;font-weight:600}
  .tg{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:5px;margin-left:7px}
  .tg.br{background:var(--wash);color:var(--hw)}.tg.tag{background:var(--ppbg);color:var(--pp)}.tg.head{background:var(--okbg);color:var(--okink)}
  .cmeta{font-size:11px;color:var(--ink3);margin-top:5px;display:flex;align-items:center;gap:7px}
  .cmeta .hash{font-family:var(--mono);background:#F1F0ED;padding:1px 6px;border-radius:4px}
  .cmeta .av{width:18px;height:18px;font-size:8px}
  .diffp{padding:16px;position:sticky;top:16px;align-self:start}
  .diffp .h{font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:4px}
  .diffp .h .hash{font-family:var(--mono);color:var(--hw);font-size:11px}
  .dl{font-family:var(--mono);font-size:11.5px;padding:4px 10px;border-radius:5px;margin-bottom:3px;display:flex;gap:8px}
  .dl.add{background:#EAF6EF;color:#1E7049}.dl.del{background:#FBEBE7;color:#AE3B2B}.dl.mod{background:var(--wash);color:#C25A16}
  .dl .s{font-weight:700;flex:none}
  .dsec{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;margin:13px 0 6px;letter-spacing:.3px}

  .ov{position:fixed;inset:0;background:rgba(20,18,16,.45);display:none;align-items:center;justify-content:center;z-index:60}
  .ov.on{display:flex}
  .modal{width:560px;max-width:92vw;max-height:88vh;overflow-y:auto;background:#fff;border-radius:14px;box-shadow:0 30px 70px rgba(0,0,0,.3)}
  .mh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
  .mh h3{font-size:15px;font-weight:700}.mh .x{margin-left:auto;font-size:20px;color:var(--ink3);line-height:1;padding:2px 6px;border-radius:6px;cursor:pointer}
  .mh .x:hover{background:#F1F0ED}
  .mb{padding:18px 20px}
  .gate{border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
  .gate.ok{background:var(--okbg);border-color:#CDE8D8}.gate.warn{background:var(--wash);border-color:var(--hwline)}
  .gate .tt{font-weight:600;font-size:13px}.gate .ss{font-size:11.5px;color:var(--ink3)}
  .gate .cta{margin-left:auto;display:flex;gap:6px}
  .thumb{width:52px;height:34px;flex:none;border:1.5px dashed var(--line2);border-radius:5px;background:#FBFAF8;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--ink3)}
  .diffrow{display:flex;gap:8px;font-family:var(--mono);font-size:11.5px;padding:3px 0}
  .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
  .mrow{display:flex;gap:8px;margin-bottom:10px;align-items:center}
  .mrow label{width:80px;font-size:12px;color:var(--ink2);flex:none}
  .mrow input,.mrow select{flex:1;padding:8px 10px;border:1px solid var(--line2);border-radius:7px;font-size:13px}

  .pop{position:fixed;z-index:70;width:300px;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 14px 40px rgba(0,0,0,.15);display:none}
  .pop.on{display:block}
  .pop .ph{display:flex;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
  .pop .ph b{font-size:12.5px}.pop .ph .x{margin-left:auto;font-size:16px;color:var(--ink3);line-height:1;cursor:pointer;padding:1px 5px;border-radius:5px}
  .pop .ph .x:hover{background:#F1F0ED}
  .pop .pc{padding:12px 14px;font-size:12px;color:var(--ink2);line-height:1.6}
  .pop .pc .ph2{font-weight:700;color:var(--hw);font-size:11px;margin-top:8px}

  table.fin{width:100%;border-collapse:collapse;font-size:11.5px}
  table.fin th{background:#FBFAF8;font-size:10px;font-weight:700;color:var(--ink3);padding:7px 8px;border:1px solid var(--line);text-align:center}
  table.fin td{padding:3px;border:1px solid var(--line);text-align:center}
  table.fin input{width:100%;border:1px solid transparent;background:transparent;padding:5px 6px;font-size:11.5px;text-align:center;border-radius:5px;font-family:inherit}

function findWeek(day){
  for(var w=0;w<CAL.length;w++){for(var c=0;c<7;c++){if(CAL[w][c][0]===day&&!CAL[w][c][1])return w;}}
  return 1;
}
R.schedule=function(){
  var h='<div class="card" style="padding:16px"><div style="font-size:17px;font-weight:700;margin-bottom:12px">2026년 7월 <span style="font-size:12px;color:var(--ink3);font-weight:500">· 사업관리/PM 편집 · 그 외 조회 · 일정 클릭 시 수정/삭제</span></div>';
  h+='<div class="cal"><div class="head">'+['일','월','화','수','목','금','토'].map(function(d){return '<div>'+d+'</div>';}).join('')+'</div><div id="calBody"></div></div></div>';
  return h;
};
function paintCal(){
  var body=$('#calBody');if(!body)return;body.innerHTML='';
  CAL.forEach(function(wk,wi){
    var wkEl=el('<div class="week"><div class="days"></div><div class="bars"></div></div>');
    var daysEl=$('.days',wkEl);
    wk.forEach(function(d){daysEl.appendChild(el('<div class="day'+(d[1]?' out':'')+(d[0]===8&&!d[1]?' today':'')+'"><span class="n">'+d[0]+'</span></div>'));});
    // events whose start falls in this week
    var lane=0;
    EVENTS.forEach(function(ev){
      if(findWeek(ev.day)!==wi)return;
      var sCol=wk.findIndex(function(d){return d[0]===ev.day&&!d[1];});
      var eDay=Math.min(ev.end,wk[6][0]===ev.end?ev.end:wk.reduce(function(m,d){return !d[1]&&d[0]<=ev.end&&d[0]>=ev.day?d[0]:m;},ev.day));
      var eCol=wk.findIndex(function(d){return d[0]===eDay&&!d[1];});
      if(sCol<0)return; if(eCol<sCol)eCol=sCol;
      var left=(sCol/7*100),w=((eCol-sCol+1)/7*100);
      var bar=el('<div class="bar '+ev.color+'" style="left:calc('+left+'% + 3px);width:calc('+w+'% - 6px);top:'+(lane*20)+'px" data-ev="'+ev.id+'">'+ev.title+'</div>');
      $('.bars',wkEl).appendChild(bar);
      lane++;
    });
    body.appendChild(wkEl);
  });
  body.querySelectorAll('[data-ev]').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();openEventModal(parseInt(b.getAttribute('data-ev')));});});
}
function openEventModal(id){
  var ro=!canManage();

   +'</select></div></div><div class="mf">'
   +(ro?'<button class="btn" id="mc">닫기</button>'

         +'<button class="btn" id="mc">취소</button><button class="btn acc" id="evSave">저장</button>'))
   +'</div>';
  $('#ov').classList.add('on');

    $('#evSave').addEventListener('click',function(){
      var t=$('#evT').value.trim()||'제목없음',s=parseInt($('#evS').value)||8,e=parseInt($('#evE').value)||s,c=$('#evC').value;
      if(id){ev.title=t;ev.day=s;ev.end=e;ev.color=c;}

      closeOv();paintCal();
    });
    if(id)$('#evDel').addEventListener('click',function(){EVENTS=EVENTS.filter(function(e){return e.id!==id;});closeOv();paintCal();});
  }
  function row(lb,type,idn,val){return '<div class="mrow"><label>'+lb+'</label><input type="'+type+'" id="'+idn+'" value="'+esc(val)+'"'+dis+'></div>';}
}

}
function closeOv(){$('#ov').classList.remove('on');}
$('#ov').addEventListener('click',function(e){if(e.target===$('#ov'))closeOv();});

/* popover (generic; auto-flips above trigger if near bottom) */
function openPop(e,title,html){
  var p=$('#pop');$('#popT').textContent=title;$('#popC').innerHTML=html;
  var r=e.currentTarget.getBoundingClientRect();
  p.style.left=Math.min(r.left,window.innerWidth-316)+'px';
  var estH=140;
  if(r.bottom+estH>window.innerHeight){p.style.top=(r.top-estH-10)+'px';}
  else{p.style.top=(r.bottom+8)+'px';}
  p.classList.add('on');e.stopPropagation();
}
$('#popX').addEventListener('click',function(){$('#pop').classList.remove('on');});
document.addEventListener('click',function(e){var p=$('#pop');if(p.classList.contains('on')&&!p.contains(e.target))p.classList.remove('on');});

/* disclaimer button -> per-screen requirement/phase info */
$('#disclaimer').addEventListener('click',function(e){
  var info=REQINFO[CUR]||{req:'정보 없음',phase:''};
  openPop(e,TITLES[CUR]?TITLES[CUR]+' · 요구사항 안내':'요구사항 안내','<div>'+info.req+'</div><div class="ph2">'+info.phase+'</div><div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);color:var(--ink3);font-size:11px">데모 프로토타입 · 모든 데이터는 변조되었습니다</div>');
});

syncBoardNav();
go('proposals');
