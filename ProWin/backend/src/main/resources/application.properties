spring.application.name=prowin
server.port=8080

prowin.db.path=${PROWIN_DB_PATH:./data/prowin.db}
prowin.upload.path=${PROWIN_UPLOAD_PATH:./data/uploads}

spring.datasource.url=jdbc:sqlite:${prowin.db.path}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.sql.init.mode=always

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

logging.level.com.prowin=INFO
