<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TraceOps · 상세공정관리 / 테스트관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/style.css">
</head><body>

<div class="gnb">
  <div class="wm">TraceOps</div>
  <button class="tab" data-go="detail">상세공정관리</button>
  <button class="tab" data-go="test">테스트관리</button>
  <div class="sp"></div>
  <div class="util"><span class="noti">알림</span><div class="av">황</div></div>
</div>

<div class="main">
  <div class="subtabs" id="subtabs"></div>
  <div class="crumb" id="crumb"></div>

  <div class="page-hd">
    <div>
      <h1 id="title"></h1>
      <p id="desc"></p>
    </div>
    <div class="role-switch">
      <span class="lbl">권한 미리보기 (데모)</span>
      <select class="f-select" id="workerAccount" style="display:none"></select>
      <div class="seg">
        <button id="btnPL" class="active">PL</button>
        <button id="btnWorker">작업자</button>
      </div>
    </div>
  </div>

  <div class="data-bar">
    <span id="dataState"></span>
    <button class="btn text" id="btnRestore">원본 복원</button>
  </div>

  <div class="filter-card" id="filterCard">
    <div class="filter-row" id="filters"></div>
    <div class="filter-row more-filters" id="filtersAdv"></div>
    <div class="f-actions-row">
      <button class="btn text" id="btnMore">상세검색 ▾</button>
      <button class="btn ghost sm" id="btnFReset">초기화</button>
      <button class="btn sm" id="btnSearch">검색</button>
    </div>
  </div>

  <div class="result-bar">
    <div class="result-count" id="resultCount"></div>
    <div class="result-actions">
      <button class="btn ghost sm" id="btnCols">표시 컬럼 ▾</button>
      <button class="btn ghost sm" id="btnExport">내보내기</button>
      <button class="btn sm pl-only" id="btnAdd">+ 행 추가</button>
      <button class="btn sm" id="btnSave">저장</button>
      <div class="col-panel" id="colPanel"></div>
    </div>
  </div>

  <div id="banner"></div>

  <div class="card">
    <table id="grid">
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="foot-note" id="foot">
    저장은 이 브라우저(임시저장)에만 남습니다. <b>내보내기</b>로 받은 JSON을 <code>data/</code> 폴더의 같은 이름 파일에 덮어쓰면 기본 데이터가 바뀝니다.<br>
    진행상태: 완료=작업자 실적 종료일 입력 / 지연=작업자 계획 종료일이 지났는데 미완료 / 진행중=실적 시작일만 입력 / 미착수=그 외.<br>
    주황 음영 칸은 입력이 필요한 칸입니다. 값을 넣으면 음영이 사라집니다.<br>
    증적은 <b>필수</b>입니다. 작업자가 실적 시작일을 입력했는데 증적이 없으면 저장이 차단됩니다. 비고는 선택 항목입니다.
  </div>
</div>

<div class="modal-bg" id="pickModal"><div class="modal" id="pickBox"></div></div>
<div class="modal-bg" id="popModal"><div class="modal" id="popBox"></div></div>
<div class="modal-bg" id="workerModal"><div class="modal" id="workerBox"></div></div>
<div class="modal-bg" id="impactModal"><div class="modal vmodal" id="impactBox"></div></div>
<div class="modal-bg" id="chipModal"><div class="modal" id="chipBox"></div></div>
<div class="modal-bg" id="vModal"><div class="modal vmodal" id="vBox"></div></div>
<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
</body></html>
